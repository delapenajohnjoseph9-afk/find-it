<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="categories-page">

    <!-- TOP SECTION (stays fixed) -->
    <div class="top-section">

      <header class="app-header">

        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goToHome()">

          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

        <div>
          <h1 class="page-title">Categories</h1>
          <div class="page-subtitle">Find what you need, faster</div>
        </div>

      </header>

    </div>


    <!-- SCROLLING CATEGORY GRID -->
    <div class="content-scroll">

      <div class="category-grid">

      <!-- SMARTPHONES -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Smartphones')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M12 18h.01"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Smartphones</span>
            <span class="category-description">Phones & more</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- LAPTOPS -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Laptops')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Laptops</span>
            <span class="category-description">Work & play</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- HEADPHONES -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Headphones')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M3 15h3a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2zM21 15h-3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 0 2-2z"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Headphones</span>
            <span class="category-description">Better sound</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- ACCESSORIES -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Accessories')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 2v5M15 2v5M7 7h10v4a5 5 0 0 1-10 0zM12 16v6"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Accessories</span>
            <span class="category-description">Cables & chargers</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- MONITORS -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Monitors')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Monitors</span>
            <span class="category-description">Clearer views</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- GAMING -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Gaming')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.1l-1.5 6.6A3 3 0 0 0 4.2 18a3 3 0 0 0 2.3-1l1.3-1.5h8.4l1.3 1.5a3 3 0 0 0 2.3 1 3 3 0 0 0 2.9-3.3l-1.5-6.6A4 4 0 0 0 17.3 5z"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Gaming</span>
            <span class="category-description">Play more</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- CAMERAS -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Cameras')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Cameras</span>
            <span class="category-description">Capture it</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      <!-- SMARTWATCHES -->
      <button
        type="button"
        class="category-card"
        (click)="selectCategory('Smartwatches')">

        <span class="category-icon">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6l1-4h4l1 4M9 18l1 4h4l1-4M12 10v2.5l1.5 1"/>
          </svg>
        </span>

        <span class="category-bottom">
          <span class="category-text">
            <span class="category-name">Smartwatches</span>
            <span class="category-description">Health & style</span>
          </span>

          <svg aria-hidden="true" class="category-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>

      </button>

      </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation" aria-label="Main">

      <button type="button" (click)="goToHome()">
        <i class="fi fi-rs-home"></i>
        <span>Home</span>
      </button>

      <button type="button" class="active" aria-current="page">
        <i class="fi fi-rs-apps"></i>
        <span>Categories</span>
      </button>

      <button type="button" (click)="goToMessage()">
        <i class="fi fi-rs-comment"></i>
        <span>Messages</span>
      </button>

      <button type="button" (click)="goToProfile()">
        <i class="fi fi-rs-user"></i>
        <span>Profile</span>
      </button>

    </nav>

  </div>

</ion-content>
