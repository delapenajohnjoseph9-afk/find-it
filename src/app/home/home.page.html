<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="home-page">

    <!-- FIXED TOP SECTION (Header + Search + Category Chips stay fixed and do NOT scroll up) -->
    <div class="top-fixed-section">

      <!-- HEADER -->
      <header class="app-header">
        <div class="greeting">
          <div class="greeting-small">Good day</div>
          <h1 class="greeting-title">Find the best price</h1>
        </div>

        <button type="button" class="bell-button" aria-label="Notifications" (click)="goToNotifications()">
          <i class="fi fi-rs-bell"></i>
          <span class="notification-dot"></span>
        </button>
      </header>

      <!-- SEARCH + SCAN -->
      <div class="search-row">
        <div class="search-box">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input
            type="text"
            placeholder="Search products"
            aria-label="Search products"
            [value]="searchTerm"
            (input)="onSearch($event)">
        </div>

        <button type="button" class="scan-button" aria-label="Scan barcode" (click)="goToScan()">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M12 9v6M16 9v6"/>
          </svg>
        </button>
      </div>

      <!-- CATEGORY CHIPS -->
      <div class="chips" role="tablist" aria-label="Categories">
        <button
          type="button"
          class="chip"
          role="tab"
          *ngFor="let category of ['All', 'Phones', 'Laptops', 'Audio', 'Gaming']"
          [class.active]="selectedCategory === category"
          [attr.aria-selected]="selectedCategory === category"
          (click)="setCategory(category)">
          {{ category }}
        </button>
      </div>

    </div>

    <!-- SCROLLING CONTENT (Featured Deal + Trendings scroll upward smoothly) -->
    <div class="content-scroll">

      <!-- FEATURED DEAL SECTION -->
      <div class="featured-section">
        <!-- FEATURED DEAL (HORIZONTALLY SCROLLABLE & SWIPEABLE, SCROLLS UPWARD WITH CONTENT) -->
        <div
          class="featured-viewport"
          #featuredViewport
          (scroll)="onFeaturedScroll($event)"
          (touchstart)="pauseAutoSlide()"
          (touchend)="resumeAutoSlide()"
          (mouseenter)="pauseAutoSlide()"
          (mouseleave)="resumeAutoSlide()">
          <div class="featured-track">

            <div
              class="featured-slide"
              *ngFor="let deal of featuredDeals; let i = index"
              (click)="openFeaturedDeal(deal)">
              <div class="featured-image">
                <img
                  *ngIf="!imageFailed(deal.name)"
                  [src]="deal.image"
                  [alt]="deal.name"
                  (error)="onImageError(deal.name)">
                <svg *ngIf="imageFailed(deal.name)" aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/>
                </svg>
              </div>
              <div class="featured-info">
                <div class="featured-label">{{ deal.label }}</div>
                <div class="featured-name">{{ deal.name }}</div>
                <div class="featured-price">{{ deal.price }}</div>
                <div class="featured-link">Compare prices →</div>
              </div>
            </div>

          </div>
        </div>

        <!-- CAROUSEL DOTS (CLICKABLE & SYNCED) -->
        <div class="carousel-dots" role="tablist" aria-label="Featured deal slides">
          <button
            type="button"
            class="dot-indicator"
            *ngFor="let deal of featuredDeals; let i = index"
            [class.active]="activeDealIndex === i"
            [attr.aria-label]="'Go to deal ' + (i + 1)"
            (click)="scrollToDeal(i)">
          </button>
        </div>
      </div>

      <!-- TRENDING COMPARISONS -->
      <div class="trending-section">
        <div class="section-header">
          <h2 class="section-title">Trendings!</h2>
        </div>

        <div class="product-grid">
          <div class="product-card" *ngFor="let product of visibleProducts" (click)="openProduct(product)">

            <div class="product-image">
              <img
                *ngIf="!imageFailed(product.name)"
                [src]="product.image"
                [alt]="product.name"
                (error)="onImageError(product.name)">
              <svg *ngIf="imageFailed(product.name)" aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/>
              </svg>
            </div>

            <div class="product-name">{{ product.name }}</div>
            <div class="product-store">Lowest at {{ product.stores[0]?.name }}</div>

            <div class="product-bottom">
              <span class="product-price">{{ product.lowestPrice }}</span>
              <span class="saving-badge" *ngIf="getSaving(product)">{{ getSaving(product) }}</span>
            </div>

          </div>
        </div>

        <div class="no-results" *ngIf="visibleProducts.length === 0">
          <div class="no-results-title">No products found</div>
          <div class="no-results-text">Try searching for another product.</div>
        </div>
      </div>

    </div>

    <!-- BOTTOM NAVIGATION (Fixed at bottom) -->
    <nav class="bottom-navigation" aria-label="Main">

      <button type="button" class="active" aria-current="page">
        <i class="fi fi-rs-home"></i>
        <span>Home</span>
      </button>

      <button type="button" (click)="goToCategories()">
        <i class="fi fi-rs-apps"></i>
        <span>Categories</span>
      </button>

      <button type="button" (click)="goToMessage()">
        <i class="fi fi-rs-comment"></i>
        <span>Messages</span>
      </button>

      <button type="button" (click)="goToProfile()">
        <i class="fi fi-rs-user"></i>
        <span>Profile</span>
      </button>

    </nav>

  </div>

</ion-content>
