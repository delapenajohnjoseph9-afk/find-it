<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="message-page">

    <!-- TOP SECTION (stays fixed) -->
    <div class="top-section">

      <header class="app-header">

        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goToHome()">

          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

        <div>
          <h1 class="page-title">Messages</h1>
          <div class="page-subtitle">
            {{ unreadCount > 0 ? unreadCount + ' unread' : 'All caught up' }}
          </div>
        </div>

      </header>


      <div class="search-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input
          type="text"
          placeholder="Search messages"
          aria-label="Search messages"
          [value]="searchTerm"
          (input)="onSearch($event)">
      </div>

    </div>


    <!-- SCROLLING MESSAGE LIST -->
    <div class="content-scroll">

      <button
        type="button"
        class="message-item"
        [class.unread]="message.unread"
        *ngFor="let message of filteredMessages"
        (click)="openMessage(message)">

        <span class="avatar" aria-hidden="true">{{ message.name.charAt(0) }}</span>

        <span class="message-info">

          <span class="message-top">
            <span class="message-name">{{ message.name }}</span>
            <span class="message-time">{{ message.time }}</span>
          </span>

          <span class="message-preview">{{ message.preview }}</span>

        </span>

        <span class="unread-dot" *ngIf="message.unread" aria-label="Unread"></span>

      </button>


      <div class="no-results" *ngIf="filteredMessages.length === 0">
        <div class="no-results-title">No messages found</div>
        <div class="no-results-text">Try searching for another name or word.</div>
      </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation" aria-label="Main">

      <button type="button" (click)="goToHome()">
        <i class="fi fi-rs-home"></i>
        <span>Home</span>
      </button>

      <button type="button" (click)="goToCategories()">
        <i class="fi fi-rs-apps"></i>
        <span>Categories</span>
      </button>

      <button type="button" class="active" aria-current="page">
        <i class="fi fi-rs-comment"></i>
        <span>Messages</span>
      </button>

      <button type="button" (click)="goToProfile()">
        <i class="fi fi-rs-user"></i>
        <span>Profile</span>
      </button>

    </nav>

  </div>

</ion-content>
