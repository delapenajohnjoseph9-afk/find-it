<ion-content [fullscreen]="true">
  <div class="product-page" *ngIf="product; else notFound">

    <!-- TOP HEADER -->
    <header class="app-header">
      <button
        type="button"
        class="back-button"
        aria-label="Back"
        (click)="goBack()">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <div>
        <h1 class="header-title">Select a Shop</h1>
        <div class="header-subtitle">Compare prices from different stores</div>
      </div>
    </header>

    <!-- PRODUCT HERO IMAGE -->
    <div class="hero-image">
      <img
        *ngIf="!imageFailed"
        [src]="product.image"
        [alt]="product.name"
        (error)="onImageError()">
      <svg *ngIf="imageFailed" aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/>
      </svg>
    </div>

    <!-- PRODUCT TITLE & SUBTITLE -->
    <div class="product-header">
      <h2 class="product-title">{{ product.name }}</h2>
      <p class="product-subtitle">{{ product.stores.length }} stores sell this. Pick a store to continue your purchase there.</p>
    </div>

    <!-- STORE LIST (SELECT A SHOP) -->
    <div class="store-list" role="radiogroup" aria-label="Stores">
      <button
        type="button"
        class="store-option"
        role="radio"
        *ngFor="let s of product.stores; let i = index"
        [class.selected]="selectedStore === i"
        [attr.aria-checked]="selectedStore === i"
        (click)="selectStore(i)">

        <span class="radio-dot"></span>

        <span class="store-info">
          <span class="store-name">
            {{ s.name }}
            <span class="lowest-badge" *ngIf="i === 0">Lowest</span>
          </span>
          <span class="store-meta">{{ s.shipping }}</span>
        </span>

        <span class="store-price">{{ s.price }}</span>
      </button>
    </div>

    <!-- CTA BAR -->
    <div class="cta-bar">
      <button type="button" class="go-button" (click)="goToStore()">
        Go to {{ store?.name }} · {{ store?.price }}
      </button>
      <div class="cta-note">You'll finish your purchase on {{ store?.name }}.</div>
    </div>

  </div>

  <ng-template #notFound>
    <div class="product-page">
      <header class="app-header">
        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goBack()">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div>
          <h1 class="header-title">Select a Shop</h1>
        </div>
      </header>
      <div class="not-found-card">
        <p class="product-subtitle">We couldn't find this product.</p>
      </div>
    </div>
  </ng-template>
</ion-content>
