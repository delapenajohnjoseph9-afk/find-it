<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="products-page">

    <!-- TOP SECTION (stays fixed) -->
    <div class="top-section">

      <header class="app-header">

        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goBack()">

          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

        <div>
          <h1 class="page-title">{{ category | titlecase }}</h1>
          <div class="page-subtitle">Compare prices from different stores</div>
        </div>

      </header>


      <div class="search-box">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input
          type="text"
          placeholder="Search {{ category | lowercase }}"
          [attr.aria-label]="'Search ' + category"
          [value]="searchTerm"
          (input)="onSearch($event)">
      </div>


      <div class="list-header" *ngIf="filteredProducts.length > 0">
        <div class="list-count">
          {{ filteredProducts.length }}
          {{ filteredProducts.length === 1 ? 'product' : 'products' }}
        </div>
        <div class="list-sort">Sort: Lowest price</div>
      </div>

    </div>


    <!-- SCROLLING PRODUCT LIST -->
    <div class="content-scroll">

      <button
        type="button"
        class="product-row"
        *ngFor="let product of filteredProducts"
        (click)="selectProduct(product)">

        <!-- PRODUCT IMAGE -->
        <span class="product-image">

          <img
            *ngIf="!imageFailed(product)"
            [src]="product.image"
            [alt]="product.name"
            (error)="onImageError(product)">

          <!-- shown when the photo is missing or fails to load -->
          <svg *ngIf="imageFailed(product)" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/>
          </svg>

        </span>

        <!-- PRODUCT INFORMATION -->
        <span class="product-info">
          <span class="product-name">{{ product.name }}</span>
          <span class="product-price">Lowest {{ product.price }}</span>
          <span class="store-count">3 stores</span>
        </span>

        <!-- CHEVRON -->
        <svg aria-hidden="true" class="product-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </button>


      <div class="no-results" *ngIf="filteredProducts.length === 0">
        <div class="no-results-title">No products found</div>
        <div class="no-results-text">Try searching for another product.</div>
      </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation" aria-label="Main">

      <button type="button" (click)="goToHome()">
        <i class="fi fi-rs-home"></i>
        <span>Home</span>
      </button>

      <button type="button" class="active" (click)="goToCategories()">
        <i class="fi fi-rs-apps"></i>
        <span>Categories</span>
      </button>

      <button type="button" (click)="goToMessage()">
        <i class="fi fi-rs-comment"></i>
        <span>Messages</span>
      </button>

      <button type="button" (click)="goToProfile()">
        <i class="fi fi-rs-user"></i>
        <span>Profile</span>
      </button>

    </nav>

  </div>

</ion-content>
