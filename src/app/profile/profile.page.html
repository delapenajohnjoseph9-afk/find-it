<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="profile-page">

    <!-- TOP SECTION (stays fixed) -->
    <div class="top-section">

      <header class="app-header">

        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goToHome()">

          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

        <div>
          <h1 class="page-title">Profile</h1>
          <div class="page-subtitle">Manage your account</div>
        </div>

      </header>

    </div>


    <!-- SCROLLING CONTENT -->
    <div class="content-scroll">

      <!-- PROFILE INFORMATION -->
      <div class="profile-hero">

        <div class="profile-avatar" aria-hidden="true">J</div>

        <div class="profile-name">John</div>

        <div class="profile-username">@john</div>

      </div>


      <!-- PROFILE OPTIONS -->
      <div class="profile-options">

        <!-- EDIT PROFILE -->
        <button type="button" class="profile-option">

          <span class="option-icon"><i class="fi fi-rs-user-pen"></i></span>

          <span class="option-text">Edit Profile</span>

          <svg aria-hidden="true" class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>


        <!-- SAVED PRODUCTS -->
        <button type="button" class="profile-option">

          <span class="option-icon"><i class="fi fi-rs-heart"></i></span>

          <span class="option-text">Saved Products</span>

          <svg aria-hidden="true" class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>


        <!-- PRICE ALERTS -->
        <button type="button" class="profile-option">

          <span class="option-icon"><i class="fi fi-rs-bell"></i></span>

          <span class="option-text">Price Alerts</span>

          <svg aria-hidden="true" class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>


        <!-- SETTINGS -->
        <button type="button" class="profile-option">

          <span class="option-icon"><i class="fi fi-rs-settings"></i></span>

          <span class="option-text">Settings</span>

          <svg aria-hidden="true" class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>


        <!-- LOG OUT -->
        <button type="button" class="profile-option logout">

          <span class="option-icon"><i class="fi fi-rs-sign-out-alt"></i></span>

          <span class="option-text">Log Out</span>

          <svg aria-hidden="true" class="option-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>

      </div>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation" aria-label="Main">

      <button type="button" (click)="goToHome()">
        <i class="fi fi-rs-home"></i>
        <span>Home</span>
      </button>

      <button type="button" (click)="goToCategories()">
        <i class="fi fi-rs-apps"></i>
        <span>Categories</span>
      </button>

      <button type="button" (click)="goToMessage()">
        <i class="fi fi-rs-comment"></i>
        <span>Messages</span>
      </button>

      <button type="button" class="active" aria-current="page">
        <i class="fi fi-rs-user"></i>
        <span>Profile</span>
      </button>

    </nav>

  </div>

</ion-content>
