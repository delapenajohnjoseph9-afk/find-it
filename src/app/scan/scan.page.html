<ion-content [fullscreen]="true" [scrollY]="false">

  <div class="scan-page">

    <!-- HEADER -->
    <div class="top-section">

      <header class="app-header">

        <button
          type="button"
          class="back-button"
          aria-label="Back"
          (click)="goToHome()">

          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>

        </button>

        <div>
          <h1 class="page-title">Scan Product</h1>
          <div class="page-subtitle">Compare prices with a barcode</div>
        </div>

      </header>

    </div>


    <!-- SCANNER CONTENT -->
    <div class="scanner-content">

      <div class="scanner-description">
        Scan a barcode to compare product prices
        across different stores.
      </div>


      <!-- SCANNER FRAME -->
      <div class="scanner-area">

        <div class="scanner-frame" aria-hidden="true">

          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>

          <svg class="frame-barcode" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M5 6v12M8 6v12M12 6v12M15 6v12M19 6v12"/>
          </svg>

          <div class="scan-line"></div>

        </div>

        <div class="scanner-instruction">
          Position the barcode inside the frame
        </div>

      </div>

    </div>


    <!-- START SCAN -->
    <div class="scan-footer">

      <button
        type="button"
        class="start-scan-button"
        (click)="startScan()">

        <i class="fi fi-rs-barcode-scan"></i>

        <span>Start Scan</span>

      </button>

    </div>

  </div>

</ion-content>
