<ion-content [fullscreen]="true">

  <div class="signin-page">

    <div class="signin-screen">

      <!-- Find It Logo -->
      <div class="logo-circle">
        <img
          src="assets/find-it-logo.png"
          alt="Find It Logo"
          class="logo-image"
        />
      </div>

      <!-- Sign Up Fields -->
      <input
        type="text"
        class="input-field"
        placeholder="Full Name"
      >

      <input
        type="email"
        class="input-field"
        placeholder="Email"
      >

      <input
        type="text"
        class="input-field"
        placeholder="Username"
      >

      <input
        type="password"
        class="input-field"
        placeholder="Password"
      >

      <!-- Checkbox -->
      <div class="small-option">
        <div class="small-box"></div>
        <div class="small-line"></div>
      </div>

      <!-- Sign Up Button -->
      <div class="button-row">
        <button
  class="signup-button"
  (click)="goToHome()"
  [disabled]="isLoading"
>
  <span *ngIf="!isLoading">Sign Up</span>

  <span *ngIf="isLoading" class="loader"></span>
</button>
      </div>

      <!-- Already Have Account -->
      <div class="login-link">
        <span>Already have an account?</span>

        <button (click)="goToLogin()">
          Log In
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
      </div>

      
     <!-- Google Account -->
<button
  class="social-button google-button"
  (click)="goToGoogle()"
  [disabled]="isLoading"
>
  <span *ngIf="!isLoading || loadingType !== 'google'">
    <span class="google-icon">G</span>
    Continue with Google
  </span>

  <span
    *ngIf="isLoading && loadingType === 'google'"
    class="loader social-loader"
  ></span>
</button>

      <!-- Facebook Account -->
<button
  class="social-button facebook-button"
  (click)="goToFacebook()"
  [disabled]="isLoading"
>
  <span *ngIf="!isLoading || loadingType !== 'facebook'">
    <span class="facebook-icon">f</span>
    Continue with Facebook
  </span>

  <span
    *ngIf="isLoading && loadingType === 'facebook'"
    class="loader social-loader"
  ></span>
</button>

    </div>

  </div>

</ion-content>
